[package]
name        = "camber"
description = "CAMBER: hover-ship racing on real 3D tracks of polygons: hills, dips, banked turns, jumps and tunnels."
version     = "0.1.0"
edition     = "2024"
license = "MIT"
publish     = false

# A game uses only the game kit and the game library crates (here the
# shared 3D, game-3d). No heap, no floating point.
[dependencies]
game-kit = { path = "../../crates/game-kit" }
game-3d = { path = "../../crates/game-3d" }

# Tests only: the console's own rule for which screen areas a changed
# picture sends (console_video::diff), to count what each frame costs
# the screen. The game itself never uses it.
[dev-dependencies]
console-video = { path = "../../crates/console-video" }
# Tests only: the kit's stand-in console (tests/golden.rs).
game-kit = { path = "../../crates/game-kit", features = ["testing"] }

# Measuring only, OFF by default: `rec` records every race's controls and
# sends them as log lines (src/rec.rs). Never in a build handed over for
# use. Chip build with it:
#   RUSTFLAGS='--cfg feature="rec"' games/build-chip.sh games/camber
[features]
rec = []

# The PC side of `rec`: decodes a captured log, replays it, measures the
# rivals against it (`cargo run --offline --features rec --example rec`).
[[example]]
name = "rec"
path = "examples/rec/main.rs"
required-features = ["rec"]

# The PC side too: the rivals against a person's recorded race, put back
# step by step as a path (`examples/refghost/main.rs`).
[[example]]
name = "refghost"
path = "examples/refghost/main.rs"
required-features = ["rec"]
