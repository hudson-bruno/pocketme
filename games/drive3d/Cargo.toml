[package]
name        = "drive3d"
description = "DRIVE3D: the rally prototype's first part. One car slides on gravel, grass and a ford over one short stretch of road on a height map, with a chase camera. A working label, not a game name."
version     = "0.1.0"
edition     = "2024"
license = "MIT"
publish     = false

# A game uses only the game kit and the game library crates (here the
# shared 3D, game-3d). No heap, no floating point.
[dependencies]
game-kit = { path = "../../crates/game-kit" }
game-3d = { path = "../../crates/game-3d" }

# Tests only: the kit's stand-in console (tests/game.rs).
[dev-dependencies]
game-kit = { path = "../../crates/game-kit", features = ["testing"] }
