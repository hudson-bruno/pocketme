[package]
name        = "mercator"
description = "MERCATOR: fly a small trading ship through a galaxy of star systems made from one seed number; trade, fight pirates, buy better gear. Real flat-shaded 3D polygons."
version     = "0.1.0"
edition     = "2024"
license = "MIT"
publish     = false

# A game uses only the game kit. No heap, no floating point.
[dependencies]
game-kit = { path = "../../crates/game-kit" }

# Tests only: the console's own rule for which screen areas a changed
# picture sends (console_video::diff), to count what each frame costs
# the screen. The game itself never uses it.
[dev-dependencies]
console-video = { path = "../../crates/console-video" }
# Tests only: the kit's stand-in console (tests/golden.rs).
game-kit = { path = "../../crates/game-kit", features = ["testing"] }

# Measuring only, never in a game file handed over for use (CLAUDE.md):
# `--cfg merc_sizes_b` (step M2) builds ship size variant B (fighters
# 2x, freighters 2.5x the fighters; the normal build is variant A);
# `--cfg merc_site_test` starts the flight 1 km above the landing
# site's ring with the assist on HOLD (tests/site_test.rs). Cfgs, not
# features, so `--all-features` keeps testing the normal build; no
# check script builds them.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(merc_sizes_b)', 'cfg(merc_site_test)'] }
