[package]
name = "console-demo"
license = "MIT"
description = "A small console program that proves every input. It only uses the board layer, so it runs on the PC and (later) on the ESP32."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
board-layer = { path = "../board" }
# The same drawing library the firmware experiments use.
embedded-graphics = "0.8.2"
# Existing project code, used read-only and unchanged: the test pictures.
test-card = { path = "../../../crates/test-card" }
