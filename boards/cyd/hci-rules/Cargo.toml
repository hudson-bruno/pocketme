[package]
name        = "hci-rules"
description = "The CYD's rules for the gamepad radio's HCI bytes, as plain logic: packet lengths, the only commands the firmware may send this round (the gate), the commands it builds, the events it reads, the start-up sequence. No radio, no pins, no std, no heap, no unsafe; tested on the PC."
version     = "0.1.0"
edition     = "2024"
license = "MIT"
publish     = false

[dependencies]

[dev-dependencies]
# Only for the PC tests: the real gamepad host and its scripted controller
# and pad (crates/pad-host/tests/common, taken in by path), so a test can
# put every packet of whole reconnects through the gate.
board-api = { path = "../../../crates/board-api" }
pad-host  = { path = "../../../crates/pad-host" }
pad-proto = { path = "../../../crates/pad-proto" }
pad-store = { path = "../../../crates/pad-store" }
pad-view  = { path = "../../../crates/pad-view" }
